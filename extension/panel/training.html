<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Training</title>
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="panel.css" />
    <link rel="stylesheet" href="tools.css" />
  </head>
  <body>
    <header class="top">
      <a class="back" href="home.html?choose" title="Changer d'outil" aria-label="Changer d'outil">‹</a>
      <img src="../icons/training.svg" alt="" width="22" height="22" />
      <h1>Training</h1>
      <button id="openPage" type="button" class="ghost">Ouvrir ↗</button>
    </header>
    <p class="hint tagline">Se former au métier RH, à l'OLAP et à Oracle APEX : cours, exercices corrigés, examens.</p>

    <section class="card t-overall">
      <div class="t-overall-head">
        <strong>Ma progression</strong>
        <span id="overallText" class="muted"></span>
      </div>
      <span class="t-track"><i id="overallBar"></i></span>
      <p class="hint">Enregistrée dans l'extension : vous reprenez où vous en étiez, sur chaque module.</p>
    </section>

    <ul id="modules" class="t-modules"></ul>

    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="training.js"></script>
  </body>
</html>
