<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quels outils ?</title>
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="panel.css" />
    <link rel="stylesheet" href="tools.css" />
  </head>
  <body>
    <header class="top">
      <h1>Quels outils ?</h1>
    </header>

    <nav class="tools" aria-label="Outils">
      <a id="toolCapsule" class="tool" href="capsule.html">
        <img src="../icons/capsule.svg" alt="" width="44" height="44" />
        <span class="tool-text">
          <strong>Capsule</strong>
          <small>Sauvegarder les onglets de la fenêtre et les rouvrir d'un clic</small>
          <small id="capsuleCount" class="tool-count"></small>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </a>
      <a id="toolInsigth" class="tool" href="panel.html">
        <img src="../icons/icon48.png" alt="" width="44" height="44" />
        <span class="tool-text">
          <strong>Insigth</strong>
          <small>Temps de réponse des pages : du clic à l'affichage complet</small>
          <small id="insigthCount" class="tool-count insigth"></small>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </a>
      <a id="toolPrisme" class="tool" href="prisme.html">
        <img src="../icons/prisme.svg" alt="" width="44" height="44" />
        <span class="tool-text">
          <strong>Prisme</strong>
          <small>Inspecter un CSV (encodage, séparateurs, anomalies) et le convertir en ANSI ou UTF-8</small>
          <small id="prismeCount" class="tool-count prisme"></small>
        </span>
        <span class="chev" aria-hidden="true">›</span>
      </a>
    </nav>

    <script type="module" src="home.js"></script>
  </body>
</html>
