<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Insigth · Rapport</title>
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="report.css" />
  </head>
  <body>
    <header class="bar">
      <img src="../icons/icon48.png" alt="" width="26" height="26" />
      <h1>Temps de réponse par application</h1>
      <div class="bar-actions">
        <button id="xlsx" class="primary">Extraire (Excel)</button>
        <button id="csv">CSV</button>
        <a href="../options/options.html">Réglages</a>
      </div>
    </header>

    <main>
      <section id="kpis" class="kpis" aria-label="Synthèse"></section>

      <div class="toolbar">
        <div class="segmented" role="radiogroup" aria-label="Vue" id="views">
          <button type="button" role="radio" data-view="both">WiFi + Ethernet</button>
          <button type="button" role="radio" data-view="wifi">WiFi</button>
          <button type="button" role="radio" data-view="ethernet">Ethernet</button>
          <button type="button" role="radio" data-view="diff">Écart</button>
        </div>
        <input id="search" type="search" placeholder="Filtrer les applications (nom ou URL)…" aria-label="Filtrer" />
        <label class="check"><input id="incomplete" type="checkbox" /> Incomplètes seulement</label>
        <label class="stat"
          >Statistique
          <select id="stat"></select
        ></label>
      </div>

      <div id="legend" class="legend-row"></div>
      <div id="matrix" class="matrix-wrap" tabindex="0"></div>
      <p class="hint muted">
        Cliquez sur un en-tête pour trier, sur une application pour son détail.
        <a href="../options/options.html#pages">Ordre, libellés et pages masquées</a>
      </p>

      <section class="raw">
        <div class="section-head">
          <h2>Dernières mesures</h2>
          <select id="filterNet" aria-label="Filtrer par réseau">
            <option value="">Tous les réseaux</option>
            <option value="wifi">WiFi</option>
            <option value="ethernet">Ethernet</option>
          </select>
          <span id="rawCount" class="muted"></span>
        </div>
        <div id="raw"></div>
        <button id="more" type="button" hidden>Afficher plus</button>
      </section>
    </main>

    <dialog id="detail" aria-labelledby="detailTitle"></dialog>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="report.js"></script>
  </body>
</html>
