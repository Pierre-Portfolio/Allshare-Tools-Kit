<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Insight · Tableau de bord</title>
    <link rel="stylesheet" href="../common.css" />
    <link rel="stylesheet" href="report.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="../icons/insight.svg" alt="" width="28" height="28" />
        <div>
          <h1>Insight</h1>
          <p>Temps de réponse · du clic à l'affichage complet</p>
        </div>
      </div>
      <a class="link" href="../options/options.html">Réglages</a>
    </header>

    <main class="wrap">
      <!-- Export : une seule ligne -->
      <section class="export" aria-label="Exporter">
        <label class="fld grow">
          <span>Export</span>
          <select id="exType">
            <option value="all">Tout — clients × pages</option>
            <option value="page">Une page — tous les clients</option>
            <option value="client">Un client — toutes les pages</option>
            <option value="detail">Détail des temps — une page</option>
          </select>
        </label>
        <label class="fld grow" id="exPageFld" hidden>
          <span>Page</span>
          <select id="exPage"></select>
        </label>
        <label class="fld grow" id="exClientFld" hidden>
          <span>Client</span>
          <select id="exClient"></select>
        </label>
        <div class="fld">
          <span>Format</span>
          <div class="segmented small" id="exFormat" role="radiogroup" aria-label="Format">
            <button type="button" role="radio" data-format="xlsx">Excel</button>
            <button type="button" role="radio" data-format="csv">CSV</button>
          </div>
        </div>
        <div class="fld">
          <span>Ajouter</span>
          <div class="checks">
            <label><input id="exFullUrl" type="checkbox" /> URL complète</label>
            <label><input id="exUrlEnd" type="checkbox" /> Fin d'URL</label>
          </div>
        </div>
        <button id="exGo" type="button" class="primary go">Télécharger</button>
        <p id="exHelp" class="help"></p>
      </section>

      <p id="summary" class="summary"></p>

      <div class="toolbar">
        <div class="segmented small" role="radiogroup" aria-label="Vue" id="views">
          <button type="button" role="radio" data-view="both">Ethernet + WiFi</button>
          <button type="button" role="radio" data-view="ethernet">Ethernet</button>
          <button type="button" role="radio" data-view="wifi">WiFi</button>
          <button type="button" role="radio" data-view="diff">Écart</button>
        </div>
        <input id="search" type="search" placeholder="Rechercher un client, un SID…" aria-label="Rechercher" />
        <label class="toggle"><input id="incomplete" type="checkbox" /> Incomplets</label>
        <label class="toggle"><input id="anomalies" type="checkbox" /> Anomalies</label>
        <label class="inline"
          >Valeur
          <select id="stat"></select
        ></label>
      </div>
      <div id="legend" class="legend"></div>

      <div id="matrix" class="matrix-wrap" tabindex="0"></div>

      <section class="measures">
        <div class="section-head">
          <h2>Mesures</h2>
          <select id="filterNet" aria-label="Filtrer par réseau">
            <option value="">Tous les réseaux</option>
            <option value="ethernet">Ethernet</option>
            <option value="wifi">WiFi</option>
          </select>
          <span id="rawCount" class="muted"></span>
        </div>
        <div id="raw"></div>
        <button id="more" type="button" class="more" hidden>Afficher plus</button>
      </section>
    </main>

    <div id="menu" class="menu" role="menu" hidden></div>
    <dialog id="detail" aria-labelledby="detailTitle"></dialog>
    <div id="toast" class="toast" role="status"></div>
    <script type="module" src="report.js"></script>
  </body>
</html>
